[project]
name = "openscimd"
version = "0.1.0"
description = "Ferramentas e CLI para gerenciamento de artigos e livros do OpenSciMD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0.0",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "google-genai>=0.1.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
openscimd = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "main.py"]
